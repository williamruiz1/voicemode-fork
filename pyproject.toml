[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-mode"
dynamic = ["version"]
description = "VoiceMode - Voice interaction capabilities for AI assistants (formerly voice-mcp)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mike Bailey", email = "mike@failmode.com"},
]
keywords = ["mcp", "voice", "livekit", "speech", "tts", "stt", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "uv>=0.4.0",
    "fastmcp>=3.2.0,<4",  # Migrated to 3.x in VM-1242. Fixes CVSS 10.0 (GHSA-vv7q-7jx5-f767).
    "numpy",
    "sounddevice",
    "scipy",
    "openai>=1.0.0",
    "pydub",
    "audioop-lts; python_version >= '3.13'",
    "simpleaudio",
    "httpx",
    "websockets>=12.0",  # Required for voicemode connect command
    "aiohttp",  # Required for Whisper and Kokoro service installers
    "psutil>=5.9.0",
    "webrtcvad-wheels>=2.0.14",  # Maintained fork with importlib.metadata (no pkg_resources)
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.5.0",  # For parallel testing
    "pytest-timeout>=2.2.0",  # For test timeouts
    "coverage[toml]>=7.4.0",
]
scripts = [
    "flask>=3.0.0",
]
silero = [
    # Model-based VAD (founder-os endpointing fix): a per-frame P(speech) in
    # [0,1] from the vendored Silero VAD ONNX model (voice_mode/silero_vad.py),
    # replacing webrtcvad's binary decision so steady noise/breath doesn't
    # fool the silence timer. OPTIONAL — voice_mode.silero_vad imports and
    # runs (degraded, SILERO_AVAILABLE=False) fine without this installed.
    "onnxruntime>=1.17",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material[imaging]>=9.0.0",
    "pymdown-extensions>=10.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-minify-plugin>=0.7.0",
    "mkdocs-gen-files>=0.5.0",
]

[project.urls]
Homepage = "https://getvoicemode.com/"
Repository = "https://github.com/mbailey/voicemode"
Issues = "https://github.com/mbailey/voicemode/issues"

[project.scripts]
voice-mode = "voice_mode.cli:voice_mode"
voicemode = "voice_mode.cli:voice_mode"
# VM-1314: the plugin's single .mcp.json entry runs this smart launcher.
# Unset VOICEMODE_MCP_URL -> local stdio server; set -> native remote bridge.
voicemode-mcp-launcher = "voice_mode.mcp_launcher:main"

[tool.uv]
# Constrain transitive deps that have known vulnerabilities but aren't bumped
# automatically because nothing in the tree requires a newer version.
# Format: each entry is a PEP 508 specifier that uv applies during resolution.
#
# SCOPE WARNING (added 2026-09-13, see docs/dev/live-environment-pinning.md):
# this table is read by `uv sync` / `uv lock` / the contributor `.venv` —
# it is NOT read by `uv tool install --editable ...` (verified empirically:
# setting cryptography==40.0.2 here changes nothing about what that command
# installs). The live tool environment that backs running voice servers
# (`~/.local/share/uv/tools/voice-mode/`) is installed via `uv tool install
# --editable`, so it is pinned separately by the committed constraints file
# `constraints-live.txt` + `scripts/install-live-tool-env.sh`, NOT by this
# block. Keep this block for dev-venv parity, but do not assume it protects
# the live tool env — see the doc above before touching either mechanism.
constraint-dependencies = [
    "cryptography>=46.0.7",  # VM-1244 floor; superseded below by the exact pin, kept for the vuln rationale.
    "aiofile==3.12.3",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "authlib==1.8.0",
    "beartype==0.22.9",
    "cachetools==7.1.8",
    "caio==0.12.4",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "click==8.5.0",
    "cryptography==50.0.1",
    "cyclopts==4.25.2",
    "dnspython==2.8.0",
    "docstring-parser==0.18.0",
    "email-validator==2.3.0",
    "exceptiongroup==1.3.1",
    "fastmcp-slim==3.4.7",
    "fastmcp==3.4.7",
    "flatbuffers==25.12.19",
    "frozenlist==1.8.0",
    "griffelib==2.3.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.12.0",
    "httpx-sse==0.4.3",
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "idna==3.19",
    "jaraco-classes==3.4.0",
    "jaraco-context==6.1.2",
    "jaraco-functools==4.6.0",
    "jiter==0.17.0",
    "joserfc==1.7.5",
    "jsonref==1.1.0",
    "jsonschema-path==0.5.0",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "markdown-it-py==4.2.0",
    "mcp==1.30.0",
    "mdurl==0.1.2",
    "more-itertools==11.1.0",
    "multidict==6.8.0",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "openai==3.13.0",
    "openapi-pydantic==0.5.1",
    "opentelemetry-api==1.44.0",
    "packaging==26.3",
    "pathable==0.6.0",
    "platformdirs==4.11.8",
    "propcache==0.5.2",
    "protobuf==7.36.1",
    "psutil==7.2.2",
    "py-key-value-aio==0.4.5",
    "pyaec==1.0.1",
    "pycparser==3.0",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "pydub==0.25.1",
    "pygments==2.21.0",
    "pyjwt==2.14.0",
    "pyperclip==1.11.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rich-rst==2.1.0",
    "rich==15.0.0",
    "rpds-py==2026.6.3",
    "scipy==1.18.1",
    "simpleaudio==1.0.4",
    "sniffio==1.3.1",
    "sounddevice==0.5.6",
    "sse-starlette==3.4.11",
    "starlette==1.6.0",
    "truststore==0.10.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uncalled-for==0.4.0",
    "uv==0.12.13",
    "uvicorn==0.52.4",
    "watchfiles==1.2.0",
    "webrtcvad-wheels==2.0.14",
    "websockets==17.1",
    "yarl==1.24.5",
]

[tool.hatch.build.targets.wheel]
packages = ["voice_mode"]
include = [
  "voice_mode/**/*.py",
  "voice_mode/**/*.sh",
  "voice_mode/**/*.plist",
  "voice_mode/**/*.service",
  "voice_mode/templates/**/*",
  "voice_mode/data/**/*.yaml",
  "voice_mode/data/**/*.json",
  "voice_mode/data/**/*.cue",
  "voice_mode/data/**/*.ffmeta",
  "voice_mode/data/**/*.sha256",
  "voice_mode/data/**/*.bash",
  "voice_mode/data/**/*.patch",
]
# artifacts overrides .gitignore for VCS-ignored files that should be packaged
artifacts = [
  "voice_mode/data/**/*.mp3",
  "voice_mode/data/**/*.wav",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc", 
  "**/*.pyo",
  "**/*.pyd",
  "**/.DS_Store",
  "**/*.log",
  "**/node_modules",
  "**/.next/cache",
  "**/tests",
  "**/.env",
  "**/.git",
]

[tool.hatch.build.targets.sdist]
include = [
  "/voice_mode",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/CHANGELOG.md",
]
# artifacts overrides .gitignore for VCS-ignored files that should be packaged
artifacts = [
  "voice_mode/data/**/*.mp3",
  "voice_mode/data/**/*.wav",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.pyd",
  "**/.DS_Store",
  "**/*.log",
]

[tool.hatch.version]
path = "voice_mode/__version__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--ignore=tests/manual",
    "--cov=voice_mode",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may interact with services)",
    "slow: Tests that take > 1s",
    "manual: Manual tests requiring human interaction",
    "real_microphone: Test genuinely needs the real input device (opts out of the conftest microphone guard)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["voice_mode"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "test-env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "except ImportError:",
]
precision = 2
skip_covered = true
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

